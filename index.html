<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cahier de français</title>
    <!-- Icons: public/icon.svg is the source; the PNGs are drawn from it at their sizes. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Cahier" />
    <!-- The colour of the browser bar and the phone's status bar: the page background (--bg),
         set by the script below and by applyTheme in settings.ts -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The theme, set before the first paint so a dark screen never flashes white.
      // src/shared/config/settings.ts keeps it up to date afterwards; keep the two in step.
      (function () {
        var theme;
        try {
          theme = (JSON.parse(localStorage.getItem('cahier-fr:settings')) || {}).theme;
        } catch (error) {
          // unreadable settings: follow the system
        }
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = theme === 'dark' || (theme !== 'light' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#191919' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
